name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: "postgresql+psycopg://test:test@localhost:5432/migration_test"
      BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      DATABASE_URL: "sqlite:///:memory:"
      WEBAPP_URL: "http://localhost:8000"
      BOT_MODE: "polling"
      SECRET_KEY: "ci-only-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lesson recovery and duplicate submission regressions
        run: python -m unittest discover -s tests -p 'test_lesson_resume.py' -v
      - name: PostgreSQL migration safety regressions
        run: |
          test -n "$TEST_POSTGRES_URL"
          python -m unittest tests.test_verify_migration_head tests.test_postgres_migration_lock -v
      - name: A1-B2 answer evaluation safety regressions
        run: python -m unittest tests.test_answer_evaluation_safety -v
      - run: python -m unittest discover -s tests -v
      - name: Validate all authored curriculum lessons
        run: python audit_curriculum.py --output curriculum-audit.json
      - name: Upload curriculum audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-quality-audit
          path: backend/curriculum-audit.json
          retention-days: 30
      - name: A1-B2 provisional linguistic challenge audit
        run: python -m tests.linguistic_challenge_suite
      - name: Run provisional v88 evaluation audit
        run: python -m tests.audit_curated_evaluation_v88
      - name: Upload provisional v88 evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v88-evaluation-audit
          path: |
            backend/tests/fixtures/evaluation_v88_curated_audit.json
            backend/tests/fixtures/evaluation_v88_triage.json
          retention-days: 30
      - run: python scripts/audit_launch_readiness.py
      - run: alembic heads
      - run: python -m compileall -q app migrations scripts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/mini-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run check:bundle

  e2e-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/mini-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-qa-report
          path: |
            frontend/mini-app/playwright-report
            frontend/mini-app/test-results
          retention-days: 14
